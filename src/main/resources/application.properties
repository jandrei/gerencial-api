# =========================================================================
# Database Configuration
# =========================================================================

# Default/Dev Configuration (uses H2 in-memory database)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:gerencial;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Production Configuration (uses PostgreSQL, active during %prod profile)
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gerencial}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}

# =========================================================================
# Flyway Configuration
# =========================================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# If Hibernate ORM is added later, uncomment this line to let Flyway handle schema migrations
# quarkus.hibernate-orm.database.generation=none

# =========================================================================
# OpenAPI & Swagger UI Configuration
# =========================================================================
# Always include Swagger UI in the build (for prod and dev environments)
quarkus.swagger-ui.always-include=true

# =========================================================================
# Configuração de CORS
# =========================================================================
# Habilita o filtro de CORS globalmente no Quarkus
quarkus.http.cors.enabled=true

# Origens permitidas (configurável via variável de ambiente ALLOWED_ORIGINS, padrão permite tudo para desenvolvimento)
quarkus.http.cors.origins=${ALLOWED_ORIGINS:*}

# Métodos HTTP permitidos
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

# Cabeçalhos HTTP permitidos nas requisições
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Origin,X-Requested-With,X-Dev-User-Email,X-Organization-Id

# Cabeçalhos expostos ao cliente
quarkus.http.cors.exposed-headers=Content-Disposition

# Tempo (em segundos) que a resposta preflight (OPTIONS) pode ser mantida em cache pelo navegador (1 hora)
quarkus.http.cors.access-control-max-age=3600

# =========================================================================
# Cabeçalhos de Segurança (Proteção contra XSS e outros ataques)
# =========================================================================
# Content Security Policy (CSP) para mitigar XSS restringindo a origem dos recursos executáveis
#quarkus.http.header."Content-Security-Policy".value=default-src 'self'; frame-ancestors 'none'; object-src 'none';

# Proteção contra XSS antiga mas ainda relevante para navegadores legados (bloqueia páginas se detectar XSS refletido)
#quarkus.http.header."X-XSS-Protection".value=1; mode=block

# Previne que o navegador tente adivinhar (MIME-sniffing) o tipo de conteúdo diferente do declarado (ex: carregar JSON como HTML/JS)
#quarkus.http.header."X-Content-Type-Options".value=nosniff

# Proteção contra Clickjacking (impede que a API seja incorporada dentro de iframes)
#quarkus.http.header."X-Frame-Options".value=DENY

# Referrer Policy para controlar a quantidade de informações de referência enviadas nas requisições
#quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# =========================================================================
# OIDC / PROTEÇÃO DO ENDPOINT
# =========================================================================
# Nome do provedor
quarkus.oidc.tenant-id=google

# URL do emissor de tokens do Google
quarkus.oidc.auth-server-url=https://accounts.google.com

# Define que o backend vai apenas aceitar e validar tokens (Bearer Token), sem redirecionar para telas de login
quarkus.oidc.application-type=service

# O Client ID que você obteve no Google Cloud Console
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}

# Permitir acesso público ao Swagger UI e OpenAPI
#quarkus.http.auth.permission.permit1.paths=/q/swagger-ui/*,/q/openapi*,/openapi*
#quarkus.http.auth.permission.permit1.policy=permit